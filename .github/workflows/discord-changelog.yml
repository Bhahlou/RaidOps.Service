name: Discord Changelog

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post changelog to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          AVATAR_URL: ${{ secrets.DISCORD_CHANGELOG_AVATAR_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Strip HTML comments, HTML tags, then collapse blank lines
          BODY=$(echo "$PR_BODY" \
            | sed 's/<!--.*-->//g' \
            | sed 's/<[^>]*>//g' \
            | sed '/^[[:space:]]*$/d' \
            | head -c 4000)

          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg username "RaidOps Changelog" \
              --arg avatar "$AVATAR_URL" \
              --arg title "[$REPO] $PR_TITLE" \
              --arg desc "$BODY" \
              --arg url "$PR_URL" \
              --arg author "$PR_AUTHOR" \
              '{
                username: $username,
                avatar_url: $avatar,
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 16750848,
                  footer: { text: ("Merged by " + $author) }
                }]
              }')"
